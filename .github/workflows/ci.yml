name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System audio tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests tools
      - name: Python tests
        run: pytest -q
      - name: JavaScript syntax
        run: node --check src/cadence_studio/web/app.js
      - name: Taxonomy reproducibility
        run: |
          python tools/build_taxonomy.py
          git diff --exit-code src/cadence_studio/resources/taxonomy.json
