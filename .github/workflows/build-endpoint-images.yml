name: Build Flamingo endpoint image

# Build the large Flamingo inference image on GitHub's runners instead of
# uploading it from a home connection.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag"
        required: true
        default: "0.2.2"

permissions:
  contents: read
  packages: write

jobs:
  build-flamingo:
    name: cadence-flamingo
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free disk space for the 13GB image build
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Flamingo
        uses: docker/build-push-action@v6
        with:
          context: deploy/inference-endpoint
          file: deploy/inference-endpoint/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/${{ github.repository_owner }}/cadence-flamingo:${{ inputs.tag }}
          build-args: |
            MODEL_FAMILY=flamingo
