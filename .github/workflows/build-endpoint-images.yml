name: Build endpoint images

# Build the 13GB inference images on GitHub runners instead of uploading them
# from a home connection. MOSS is already published as 0.2.2; Flamingo is the
# remaining image. Use a new tag for future inference-container changes.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag"
        required: true
        default: "0.2.2"
      target:
        description: "Which image(s) to build"
        type: choice
        required: true
        default: "flamingo"
        options:
          - flamingo
          - moss
          - both

permissions:
  contents: read
  packages: write

jobs:
  build-flamingo:
    name: cadence-flamingo
    if: ${{ inputs.target == 'flamingo' || inputs.target == 'both' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free disk space for the 13GB image build
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Flamingo
        uses: docker/build-push-action@v6
        with:
          context: deploy/inference-endpoint
          file: deploy/inference-endpoint/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/${{ github.repository_owner }}/cadence-flamingo:${{ inputs.tag }}
          build-args: |
            MODEL_FAMILY=flamingo

  build-moss:
    name: cadence-moss
    if: ${{ inputs.target == 'moss' || inputs.target == 'both' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free disk space for the 13GB image build
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push MOSS
        uses: docker/build-push-action@v6
        with:
          context: deploy/inference-endpoint
          file: deploy/inference-endpoint/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/${{ github.repository_owner }}/cadence-moss:${{ inputs.tag }}
          build-args: |
            MODEL_FAMILY=moss
