name: Build endpoint images

# Build the two 13GB inference images on GitHub's runners instead of uploading
# them from a home connection. Run manually from Actions → Build endpoint images.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag"
        required: true
        default: "0.2.2"
      target:
        description: "Which image(s) to build"
        type: choice
        required: true
        default: "flamingo"
        options:
          - flamingo
          - both

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.image }}
    if: ${{ inputs.target == 'both' || matrix.family == 'flamingo' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: moss
            image: cadence-moss
          - family: flamingo
            image: cadence-flamingo
    steps:
      - name: Free disk space for the 13GB image build
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: deploy/inference-endpoint
          file: deploy/inference-endpoint/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ inputs.tag }}
          build-args: |
            MODEL_FAMILY=${{ matrix.family }}
