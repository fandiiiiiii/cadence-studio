  <div class="app-shell" id="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand-row">
        <a class="brand" href="#/overview" aria-label="Cadence Studio 首页">
          <span class="brand-mark"><svg><use href="#i-logo"></use></svg></span>
          <span class="brand-word">
            <strong>Cadence</strong>
            <span>声刻 · STUDIO</span>
          </span>
        </a>
        <button class="icon-button mobile-only" data-action="close-sidebar" aria-label="关闭导航"><svg><use href="#i-x"></use></svg></button>
      </div>

      <button class="workspace-chip" data-action="open-settings" title="工作区设置">
        <span class="workspace-avatar" id="workspace-avatar">C</span>
        <span class="workspace-meta">
          <strong id="workspace-name">My Music Studio</strong>
          <small>Personal workspace</small>
        </span>
        <svg class="chev"><use href="#i-chevron-down"></use></svg>
      </button>

      <nav class="main-nav" aria-label="主导航">
        <span class="nav-label">Workspace</span>
        <a href="#/overview" class="nav-item" data-nav="overview"><svg><use href="#i-grid"></use></svg><span>总览</span><kbd>G</kbd></a>
        <a href="#/batches" class="nav-item" data-nav="batches"><svg><use href="#i-layers"></use></svg><span>批次</span><em id="nav-batch-count">0</em></a>
        <a href="#/taxonomy" class="nav-item" data-nav="taxonomy"><svg><use href="#i-tag"></use></svg><span>标签体系</span><em>641</em></a>
        <a href="#/activity" class="nav-item" data-nav="activity"><svg><use href="#i-pulse"></use></svg><span>活动</span></a>
      </nav>

      <div class="sidebar-recent">
        <div class="sidebar-section-head"><span class="nav-label">Recent batches</span><button class="text-button" data-action="new-batch">New</button></div>
        <div id="sidebar-batches" class="sidebar-batches"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div>
      </div>

      <div class="sidebar-bottom">
        <button class="endpoint-card" id="endpoint-card" data-action="endpoint-panel" aria-label="端点状态">
          <span class="endpoint-topline"><span class="status-dot" id="endpoint-dot"></span><span id="endpoint-state">检查端点…</span><span class="endpoint-chevron"><svg><use href="#i-chevron"></use></svg></span></span>
          <strong id="endpoint-model">MOSS Music 8B</strong>
          <small id="endpoint-meta">等待连接</small>
        </button>
        <a href="#/settings" class="nav-item nav-settings" data-nav="settings"><svg><use href="#i-settings"></use></svg><span>设置</span><kbd>⌘,</kbd></a>
        <div class="sidebar-foot">
          <span>v0.2.2</span>
          <span id="server-health"><span class="status-dot small ok"></span>Local</span>
        </div>
      </div>
    </aside>

    <div class="main-shell">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-button mobile-only" data-action="open-sidebar" aria-label="打开导航"><svg><use href="#i-menu"></use></svg></button>
          <nav class="breadcrumb" id="breadcrumb" aria-label="面包屑"><span>Workspace</span><svg><use href="#i-chevron"></use></svg><b>总览</b></nav>
        </div>
        <div class="topbar-right">
          <button class="command-trigger" data-action="command" aria-label="打开命令面板">
            <svg><use href="#i-search"></use></svg>
            <span>搜索批次、曲目或命令</span>
            <kbd>⌘K</kbd>
          </button>
          <div class="top-endpoint" id="top-endpoint" title="端点状态">
            <span class="status-dot" id="top-dot"></span><span id="top-state">Checking</span>
          </div>
          <button class="label-lang-button" id="label-lang-toggle" data-action="toggle-label-lang" aria-label="切换标签显示语言">中</button>
          <button class="icon-button" data-action="toggle-theme" aria-label="切换主题"><svg class="theme-icon"><use href="#i-moon"></use></svg></button>
          <button class="avatar-button" data-action="open-settings" aria-label="工作区设置">Q</button>
        </div>
      </header>

      <main id="view" class="view" tabindex="-1">
        <div class="loading-screen">
          <span class="brand-mark large"><svg><use href="#i-logo"></use></svg></span>
          <p>正在打开声刻工作台</p>
        </div>
      </main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="drawer-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <div id="palette-root"></div>
  <div id="drop-overlay" class="drop-overlay" aria-hidden="true">
    <div class="drop-overlay-inner"><svg><use href="#i-upload"></use></svg><strong>放下音频，创建新批次</strong><span>MP3 · WAV · FLAC · M4A · OGG</span></div>
  </div>
  <script src="/assets/app.js" defer></script>
